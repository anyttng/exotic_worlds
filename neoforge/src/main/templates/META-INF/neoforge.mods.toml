# NeoForge mod metadata. Placeholders are expanded from gradle.properties at build time.

# The license for the mod (mandatory).
license="${mod_license}"

# A list of mods.
[[mods]] #mandatory

# The modid of the mod.
modId="${mod_id}" #mandatory

# The version number of the mod.
version="${mod_version}" #mandatory

# A display name for the mod.
displayName="${mod_name}" #mandatory

# A file name (in the root of the mod JAR) containing a logo for display.
logoFile="logo.png"

# The authors of the mod, displayed in the mod UI.
authors="Anyttng"

# The description text for the mod (multi line!).
description='''
Circumnavigate the world — walk, sail or fly past the border and come out on the far side. No walls, no teleports, one seamless world.
'''

# NeoForge dependency.
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

# Minecraft dependency.
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# JourneyMap dependency — the compat mixins shadow renderer symbols the older JourneyMap has not got.
[[dependencies.${mod_id}]]
    modId="journeymap"
    type="optional"
    versionRange="[${journeymap_min_version},)"
    ordering="NONE"
    side="CLIENT"

# FTB Chunks dependency — the map folds inject into private members the older FTB Chunks has not got.
[[dependencies.${mod_id}]]
    modId="ftbchunks"
    type="optional"
    versionRange="[${ftbchunks_min_version},)"
    ordering="NONE"
    side="CLIENT"

# C2ME dependency — the compat mixins shadow C2ME internals the older C2ME has not got.
[[dependencies.${mod_id}]]
    modId="c2me"
    type="optional"
    versionRange="[${c2me_min_version},)"
    ordering="NONE"
    side="BOTH"

[[mixins]]
config="toroidal_world.mixins.json"

[[mixins]]
config="toroidal_world.shape.mixins.json"

[[mixins]]
config="toroidal_world.compat.journeymap.mixins.json"

[[mixins]]
config="toroidal_world.compat.xaero.mixins.json"

[[mixins]]
config="toroidal_world.compat.ftbchunks.mixins.json"

[[mixins]]
config="toroidal_world.compat.c2me.mixins.json"

[[mixins]]
config="toroidal_world.compat.distanthorizons.mixins.json"

[[mixins]]
config="toroidal_world.compat.terrablender.mixins.json"

[[mixins]]
config="toroidal_world.compat.scalablelux.mixins.json"

[[mixins]]
config="toroidal_world.compat.biolith.mixins.json"

[[mixins]]
config="toroidal_world.compat.wover.mixins.json"

[[mixins]]
config="toroidal_world.compat.betterend.mixins.json"

[[mixins]]
config="toroidal_world.compat.sodium.mixins.json"

[[mixins]]
config="toroidal_world.compat.lithium.mixins.json"

[[mixins]]
config="toroidal_world.neoforge.mixins.json"
