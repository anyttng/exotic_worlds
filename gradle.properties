org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# https://projects.neoforged.net/neoforged/neoforge
minecraft_version=26.2
minecraft_version_range=[26.2]
neo_version=26.2.0.86
# NeoForm (vanilla Mojmap) pin for the loader-free 'common' module; read from the neoforge userdev config of neo_version.
neoform_version=26.2-2
# Mixin + MixinExtras for common's compileOnly classpath — the same versions the neo_version userdev config ships.
mixin_version=0.17.3+mixin.0.8.7
mixinextras_version=0.5.4
# MixinSquared — reaching C2ME's own mixin handlers from the compat module. Bundled by both loader builds as a floor,
# never a pin: C2ME ships its own copy and the higher version wins.
mixinsquared_version=0.3.7-beta.3
# C2ME (compileOnly compat, Modrinth maven version id) — the chunk-system compat mixins name its types in their
# signatures. The published jar carries no classes of its own, so its inner module jars are unpacked at build time.
c2me_version=0.4.2-alpha.0.96+26.2
# The oldest C2ME per loader whose internals the compat mixins were checked against; below it the loaders refuse the
# game. The two loaders publish separate build streams, hence two numbers.
c2me_fabric_min_version=0.4.2-alpha.0.40
c2me_neoforge_min_version=0.4.2-alpha.0.96

# The 26.x no-mappings mode lives in the 1.17 snapshots — the line Fabric's own example mod pins for 26.2.
fabric_loom_version=1.17-SNAPSHOT
fabric_loader_version=0.19.5
fabric_api_version=0.161.0+26.2
# ModMenu supplies the Fabric side's config-screen entrypoint; compileOnly, so the jar loads without it.
modmenu_version=20.0.2
# Aligned with the junit-bom that FML's junit launcher (junit-fml) imports.
junit_version=5.13.4
# JourneyMap plugin API (compileOnly compat) — the version the installed JourneyMap bundles as its jarjar API.
journeymap_api_version=26.2-2.0.0
# JourneyMap itself (compileOnly compat, Modrinth maven version id) — the API jar carries no client internals, and the
# render mixins name them in their signatures; the neoforge flavor is the unobfuscated one, so it serves fabric too.
journeymap_version=26.2-6.0.5+neoforge
# The oldest JourneyMap this mod supports; below it the loaders refuse the game.
journeymap_min_version=26.2-6.0.5
# Xaero's Minimap + World Map (compileOnly compat, Modrinth maven version ids) — no API jars exist, the full
# neoforge jars are compiled against; 26.x is unobfuscated so they serve the fabric module too.
xaero_minimap_version=neoforge-26.2-26.4.2
xaero_worldmap_version=neoforge-26.2-1.44.2
# Distant Horizons (compileOnly compat, Modrinth maven version number) — one jar serves both loaders and is
# unobfuscated on 26.x, so it is compiled against as-is; the storage-fold mixins name its repository types.
distanthorizons_version=3.3.0-26.2
# TerraBlender (compileOnly compat, Modrinth maven version id of its NeoForge 26.2.0.0.2 file, since every loader's
# file shares that version number) — the region-map fold mixins name its layer types.
terrablender_version=TzDe72Nr
# Biolith (compileOnly compat, Modrinth maven version id of its NeoForge 3.7.0-beta.1 file, since each loader's file
# carries the same version number) — the replacement-noise mixin names its placement and noise classes.
biolith_version=NRUCkqSp
# WorldWeaver: New Dawn (compileOnly compat, Modrinth maven version id of its Fabric 26.2.3 file, unobfuscated on 26.x;
# the fork's NeoForge file carries the same packages) — the biome-map fold mixins name its generator and math types.
worldweaver_version=9Eetuk3q
# BetterEnd: New Dawn and its BCLib (compileOnly compat, Modrinth maven version numbers of their Fabric 26.2 files, the
# builds the Fabric server instance runs) — the End terrain fold mixins name BetterEnd's generator and BCLib's SDF types.
betterend_version=26.2.4-fabric
bclib_version=26.2.2-fabric
# Simple Atlas (compileOnly compat, Modrinth maven version id of its 26.2 file, since the 26.1.x file shares the version
# number 1.2.0; Fabric only) — the atlas fold mixins name its map selector, waypoint decorations and icon anchor.
simple_atlas_version=6Hy4rXil
# Sodium (compileOnly compat, Modrinth maven version number) — the Fabric file, because the NeoForge one keeps its
# classes in a jar-in-jar; 26.x is unobfuscated, so it serves both modules. The offset-seed mixins name its renderers.
sodium_version=mc26.2-0.9.2-fabric

## Mod Properties

mod_license=MIT
mod_group_id=com.toroidalworld
toroidal_world_version=0.19.2
