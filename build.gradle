// Aggregator: the mod is built by the loader subprojects — 'common' (vanilla-only code and resources), 'neoforge' and
// 'fabric' (entrypoint, platform glue, loader jar) — and packed here into the one jar that ships.
plugins {
    id 'base'
    id 'idea'
    id 'net.ltgt.errorprone' apply false
}

// Static analysis on every compile task, tests included: a warning fails the build. Deprecation stays off because an
// API deprecated on one game line is still the only one on another.
subprojects {
    pluginManager.withPlugin('java') {
        pluginManager.apply('net.ltgt.errorprone')

        dependencies {
            errorprone "com.google.errorprone:error_prone_core:${errorprone_version}"
        }

        tasks.withType(JavaCompile).configureEach {
            // Java 21 has no unnamed variable, so a resource held only for its scope stays named and try stays off.
            options.compilerArgs += ['-Xlint:all,-deprecation,-processing,-classfile,-serial,-try', '-Werror']
            // Shadowed fields and injected handlers read as unused or unreachable outside the mixin runtime.
            options.errorprone.excludedPaths = '.*/mixin/.*'
            // Identity is the contract wherever == is written (an unchanged fold returns the same instance); format
            // strings are constants by the workspace's own rule.
            options.errorprone.disable('ReferenceEquality', 'InlineFormatString')
        }
    }
}

// The loader jars are this script's inputs, so their tasks have to exist before it names them.
evaluationDependsOnChildren()

def modId = 'exotic_worlds'
def shellId = "${modId}_bundle"
def modVersion = exotic_worlds_version
def buildSuffix = findProperty("${modId}_build")
def withBuildSuffix = { baseVersion -> buildSuffix ? "${baseVersion}-${buildSuffix}" : baseVersion }
def shellVersion = withBuildSuffix(modVersion)
def modLicense = mod_license

def neoforgeJar = project(':neoforge').tasks.named('jar', Jar)
def fabricJar = project(':fabric').tasks.named('remapJar', AbstractArchiveTask)
def neoforgeJarName = neoforgeJar.get().archiveFileName.get()
def fabricJarName = fabricJar.get().archiveFileName.get()

// 1.21.1 is obfuscated: the Fabric build names the game in intermediary and the NeoForge build in Mojmap, so the two
// class sets cannot share one jar's root the way the 26.x merge does. The jar that ships is a shell instead — no
// classes of its own, both loader jars nested whole, and each loader reads only its own metadata and opens only the
// jar that metadata names. The shell carries its own mod id: the nested jar is the one that is exotic_worlds.
def shellMetadata = tasks.register('shellMetadata') {
    def outputDir = layout.buildDirectory.dir('shell')
    def neoforgePath = "META-INF/jarjar/${neoforgeJarName}"
    def fabricPath = "META-INF/jars/${fabricJarName}"
    inputs.property('version', shellVersion)
    inputs.property('neoforgePath', neoforgePath)
    inputs.property('fabricPath', fabricPath)
    outputs.dir(outputDir)

    doLast {
        def root = outputDir.get().asFile

        // FML 4 refuses a mods.toml without modLoader; lowcodefml is its loader for a mod that runs no code.
        new File(root, 'META-INF').mkdirs()
        new File(root, 'META-INF/neoforge.mods.toml').text = """\
modLoader="lowcodefml"
loaderVersion="[4,)"
license="${modLicense}"

[[mods]]
modId="${shellId}"
version="${shellVersion}"
displayName="Exotic Worlds (NeoForge and Fabric)"
description='''Carries the NeoForge and Fabric builds of Exotic Worlds; each loader loads its own.'''
"""

        new File(root, 'META-INF/jarjar').mkdirs()
        new File(root, 'META-INF/jarjar/metadata.json').text = groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson([jars: [[
                        identifier  : [group: 'com.exoticworlds', artifact: "${modId}-neoforge"],
                        version     : [range: "[${shellVersion},)", artifactVersion: shellVersion],
                        path        : neoforgePath,
                        isObfuscated: false]]]))

        new File(root, 'fabric.mod.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                schemaVersion: 1,
                id           : shellId,
                version      : shellVersion,
                name         : 'Exotic Worlds (NeoForge and Fabric)',
                description  : 'Carries the NeoForge and Fabric builds of Exotic Worlds; each loader loads its own.',
                license      : modLicense,
                environment  : '*',
                jars         : [[file: fabricPath]]]))
    }
}

tasks.register('modJar', Jar) {
    archiveFileName = "${modId}-${withBuildSuffix("${modVersion}+mc${minecraft_version}")}.jar"
    destinationDirectory = layout.buildDirectory.dir('libs')
    // FML names the shell's module after this; left to the file name it would be derived from the version string.
    manifest.attributes('Automatic-Module-Name': shellId)

    from(shellMetadata)
    from(neoforgeJar) { into 'META-INF/jarjar' }
    from(fabricJar) { into 'META-INF/jars' }
}
