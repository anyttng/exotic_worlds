// Aggregator: the mod is built by the loader subprojects — 'common' (vanilla-only code and resources), 'neoforge' and
// 'fabric' (entrypoint, platform glue, loader jar) — and merged here into the one jar that ships.
plugins {
    id 'base'
    id 'idea'
    id 'net.ltgt.errorprone' apply false
}

// Static analysis on every compile task, tests included: a warning fails the build. Deprecation stays off because an
// API deprecated on one game line is still the only one on another.
subprojects {
    pluginManager.withPlugin('java') {
        pluginManager.apply('net.ltgt.errorprone')

        dependencies {
            errorprone "com.google.errorprone:error_prone_core:${errorprone_version}"
            errorprone "com.uber.nullaway:nullaway:${nullaway_version}"
        }

        tasks.withType(JavaCompile).configureEach {
            options.compilerArgs += ['-Xlint:all,-deprecation,-processing,-classfile,-serial', '-Werror']
            // Shadowed fields and injected handlers read as unused or unreachable outside the mixin runtime.
            options.errorprone.excludedPaths = '.*/mixin/.*'
            // Identity is the contract wherever == is written (an unchanged fold returns the same instance); format
            // strings are constants by the workspace's own rule.
            options.errorprone.disable('ReferenceEquality', 'InlineFormatString')
            if (name == 'compileJava') {
                options.errorprone.error('NullAway')
                options.errorprone.option('NullAway:AnnotatedPackages', 'com.exoticworlds')
            } else {
                options.errorprone.disable('NullAway')
            }
        }
    }

    repositories {
        ivy {
            name = 'AscendiaCore'
            url = rootProject.file('../ascendia-core-mc-26-2/build/libs')
            patternLayout {
                artifact "[artifact]-[revision]+mc${minecraft_version}.[ext]"
            }
            metadataSources {
                artifact()
            }
            content {
                includeGroup 'com.ascendia'
            }
        }
    }
}

ext.ascendiaCoreModule = "com.ascendia:ascendia_core:${ascendia_core_version}"

// The loader jars are this script's inputs, so their tasks have to exist before it names them.
evaluationDependsOnChildren()

def modId = 'exotic_worlds'
def buildSuffix = findProperty("${modId}_build")
def withBuildSuffix = { baseVersion -> buildSuffix ? "${baseVersion}-${buildSuffix}" : baseVersion }

def neoforgeJar = project(':neoforge').tasks.named('jar', Jar)
def fabricJar = project(':fabric').tasks.named('jar', Jar)

// The one file that ships, for both loaders: 26.x is unobfuscated, so one set of classes serves either, and each loader
// reads only its own metadata and its own nested libraries. The manifest is the Fabric build's, whose Fabric-Mixin
// attributes Fabric Loader reads; shared classes are the NeoForge build's, which are common's own output.
tasks.register('modJar', Zip) {
    archiveFileName = "${modId}-${withBuildSuffix("${exotic_worlds_version}+mc${minecraft_version}")}.jar"
    destinationDirectory = layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    def manifestPath = 'META-INF/MANIFEST.MF'
    def jarJarCore = 'META-INF/jarjar/ascendia_core-'
    def fabricNestedCore = 'META-INF/jars/ascendia_core-'
    def neoforgeFile = neoforgeJar.flatMap { it.archiveFile }
    def fabricFile = fabricJar.flatMap { it.archiveFile }
    def entriesOf = { jar ->
        new java.util.zip.ZipFile(jar.asFile).withCloseable { zip -> zip.entries().collect { it.name }.toSet() }
    }
    // Which build a shared path comes from is stated, never left to the order the specs are walked in.
    def neoforgeEntries = neoforgeFile.map(entriesOf)
    def fabricEntries = fabricFile.map(entriesOf)

    // Fabric Loader reads Core only under META-INF/jars, while FML opens any path its metadata names.
    doFirst {
        def unmatched = neoforgeEntries.get()
                .findAll { it.startsWith(jarJarCore) }
                .collect { fabricNestedCore + it.substring(jarJarCore.length()) }
                .findAll { !fabricEntries.get().contains(it) }
        if (unmatched) {
            throw new GradleException("The NeoForge build nests an Ascendia Core the Fabric build lacks: ${unmatched}")
        }
    }

    from(zipTree(neoforgeFile)) {
        exclude manifestPath
        exclude "${jarJarCore}*.jar"
        filesMatching('META-INF/jarjar/metadata.json') {
            filter { line -> line.replace(jarJarCore, fabricNestedCore) }
        }
    }
    from(zipTree(fabricFile)) {
        exclude { element ->
            element.relativePath.pathString != manifestPath
                    && neoforgeEntries.get().contains(element.relativePath.pathString)
        }
    }
    from('THIRD_PARTY_NOTICES')
}
