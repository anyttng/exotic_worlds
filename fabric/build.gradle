plugins {
    id 'net.fabricmc.fabric-loom'
    id 'idea'
}

ext {
    mod_id = 'toroidal_world'
}

version = toroidal_world_version
group = mod_group_id

def withBuildSuffix = { baseVersion ->
    def buildSuffix = findProperty("${mod_id}_build")
    buildSuffix ? "${baseVersion}-${buildSuffix}" : baseVersion
}
def modIngameVersion = withBuildSuffix(toroidal_world_version)
def jarVersion = withBuildSuffix("${toroidal_world_version}+mc${minecraft_version}")
// The metadata closure is detached from this script by the configuration cache, so the property is read here.
def journeymapMinVersion = journeymap_min_version
def ftbchunksMinVersion = ftbchunks_min_version
def c2meMinVersion = c2me_fabric_min_version
def c2meBrokenVersion = c2me_fabric_broken_version

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Common is compiled once, in its own module, and this one takes that output: the classes the Fabric suite runs are
// then the very classes the shipped jar carries. 26.x Minecraft ships unobfuscated — no mappings line, no remapping,
// no refmap — so nothing in common's output has to pass through Loom.
evaluationDependsOn(':common')
def commonMain = project(':common').sourceSets.main

loom {
    accessWidenerPath = file('src/main/resources/toroidal_world.accesswidener')
}

repositories {
    // JourneyMap API mirror (TeamJM's own maven is flaky). Needed here too: common's sources compile in this module.
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    // JourneyMap / Xaero's Minimap / World Map jars for the compat mixins.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    // MixinSquared — the C2ME compat mixin injects into C2ME's own handler.
    maven {
        name = 'Bawnorton'
        url = 'https://maven.bawnorton.com/releases'
        content {
            includeGroup 'com.github.bawnorton.mixinsquared'
        }
    }
    // FTB Chunks and ftb-library. Needed here too: common's sources compile in this module.
    maven {
        name = 'FTB'
        url = 'https://maven.ftb.dev/releases'
        content {
            includeGroup 'dev.ftb.mods'
        }
    }
    // ModMenu, for the config-screen entrypoint.
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/releases'
        content {
            includeGroup 'com.terraformersmc'
        }
    }
}

// Same unpack as in common, for the same reason: common's sources compile in this module too, and the chunk-system
// compat mixins name C2ME types. compileOnly on both sides — the classes come from the installed C2ME at runtime.
configurations {
    c2meModules
}

dependencies {
    c2meModules "maven.modrinth:c2me-neoforge:${c2me_version}"
}

var c2meModuleJars = tasks.register('unpackC2meModules', Sync) {
    from(zipTree(configurations.c2meModules.singleFile)) {
        include 'META-INF/jars/c2me-*.jar'
        eachFile { it.relativePath = new RelativePath(true, it.name) }
    }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('c2me-modules')
}

configurations {
    xaeroLib
}

dependencies {
    xaeroLib "maven.modrinth:xaeros-world-map:${xaero_worldmap_version}"
}

var xaeroLibJars = tasks.register('unpackXaeroLib', Sync) {
    from(zipTree(configurations.xaeroLib.singleFile)) {
        include 'META-INF/jarjar/xaerolib-*.jar'
        eachFile { it.relativePath = new RelativePath(true, it.name) }
    }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('xaerolib')
}

dependencies {
    implementation commonMain.output
    compileOnly files(c2meModuleJars).asFileTree.matching { include '*.jar' }
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Not bundled: Fabric Loader carries MixinExtras itself and keeps the higher version, so a copy here is dropped
    // at load and only weighs. No annotation processor — with no remapping there is no refmap to generate.
    compileOnly "io.github.llamalad7:mixinextras-fabric:${mixinextras_version}"

    // Bundled rather than borrowed from C2ME's own jar-in-jar: that copy is C2ME's implementation detail, and leaning
    // on it would make the fold vanish the day C2ME drops or renames it. Loader JiJ keeps the highest version present,
    // so shipping ours costs nothing where C2ME already carries a newer one.
    include(implementation("com.github.bawnorton.mixinsquared:mixinsquared-fabric:${mixinsquared_version}"))

    // 26.x is unobfuscated, so the neoforge flavors compile fine here; the tile mixin reads Context.UI off the API.
    compileOnly "info.journeymap:journeymap-api-neoforge:${journeymap_api_version}"
    compileOnly "maven.modrinth:journeymap:${journeymap_version}"
    compileOnly "maven.modrinth:xaeros-minimap:${xaero_minimap_version}"
    compileOnly "maven.modrinth:xaeros-world-map:${xaero_worldmap_version}"
    compileOnly "maven.modrinth:distanthorizons:${distanthorizons_version}"
    compileOnly "maven.modrinth:terrablender:${terrablender_version}"
    compileOnly "maven.modrinth:biolith:${biolith_version}"
    compileOnly "maven.modrinth:sodium:${sodium_version}"
    compileOnly files(xaeroLibJars).asFileTree.matching { include '*.jar' }
    compileOnly("dev.ftb.mods:ftb-chunks-neoforge:${ftbchunks_version}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-library-neoforge:${ftblibrary_version}") { transitive = false }

    // The 'modmenu' entrypoint class is only ever asked for by ModMenu itself, so it never loads without it.
    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
}

tasks.named('jar', Jar) {
    archiveFileName = "${mod_id}-fabric-${jarVersion}.jar"
    // The NeoForge AT rides along in common's resources; the fabric jar carries the accesswidener instead.
    from(commonMain.output) { exclude 'META-INF/accesstransformer.cfg' }
}

tasks.named('assemble') {
    dependsOn ':common:jar'
}

// The loader-bound tests shared with the neoforge module, run here under Fabric Loader's JUnit launcher so the
// mixins this jar ships are exercised by the loader that applies them.
sourceSets.test.java.srcDir '../common/src/loaderTest/java'

// The scans are measurements over the same folded router, run by the scan tool rather than by the gate.
sourceSets.test.java.srcDir '../common/src/scan/java'

dependencies {
    testImplementation "net.fabricmc:fabric-loader-junit:${fabric_loader_version}"
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    filter {
        // A --tests pattern that names nothing in this module is a zero-test run, not a failed one.
        failOnNoMatchingTests = false
        // The scans are measurements, not the gate: test leaves them out, -Pscans runs nothing else.
        if (project.hasProperty('scans')) {
            includeTestsMatching 'com.toroidalworld.scan.*'
        } else {
            excludeTestsMatching 'com.toroidalworld.scan.*'
        }
    }
    if (project.hasProperty('scans')) {
        // Only scan classes are in this run, so concurrency here can never reach a gate test.
        systemProperty 'junit.jupiter.execution.parallel.enabled', 'true'
        systemProperty 'junit.jupiter.execution.parallel.mode.default', 'concurrent'
        systemProperty 'junit.jupiter.execution.parallel.config.strategy', 'fixed'
        systemProperty 'junit.jupiter.execution.parallel.config.fixed.parallelism',
                project.findProperty('scanThreads') ?: '2'
        maxHeapSize = '4g'
    }
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
    // The test JVM's working directory is kept under build/, so a test that writes a report is told where the module's go.
    systemProperty 'toroidal.reports', layout.buildDirectory.dir('reports').get().asFile.absolutePath
    // The vanilla log4j config writes logs/latest.log into the working directory — kept under build/, as FML does.
    workingDir = layout.buildDirectory.dir('test-run').get().asFile
    doFirst { workingDir.mkdirs() }
    // The math this jar ships is tested in common; the loader suite alone would let a red common through.
    dependsOn(':common:test')
}

processResources {
    inputs.property 'version', modIngameVersion
    inputs.property 'journeymap_min_version', journeymapMinVersion
    inputs.property 'ftbchunks_min_version', ftbchunksMinVersion
    inputs.property 'c2me_min_version', c2meMinVersion
    inputs.property 'c2me_broken_version', c2meBrokenVersion
    filesMatching('fabric.mod.json') {
        expand version: modIngameVersion, journeymap_min_version: journeymapMinVersion,
                ftbchunks_min_version: ftbchunksMinVersion,
                c2me_min_version: c2meMinVersion, c2me_broken_version: c2meBrokenVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
